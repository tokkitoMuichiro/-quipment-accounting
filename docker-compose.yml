services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: equipment
      POSTGRES_PASSWORD: equipment
      POSTGRES_DB: equipment
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment -d equipment"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://equipment:equipment@postgres:5432/equipment
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DEV_AUTH: ${DEV_AUTH:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      ADMIN_BITRIX_IDS: ${ADMIN_BITRIX_IDS:-}
      BITRIX_CLIENT_ID: ${BITRIX_CLIENT_ID:-}
      BITRIX_CLIENT_SECRET: ${BITRIX_CLIENT_SECRET:-}
      BITRIX_APPLICATION_TOKEN: ${BITRIX_APPLICATION_TOKEN:-}
      BITRIX_TOKEN_KEY: ${BITRIX_TOKEN_KEY:-}
      BITRIX_EXCEL_FILENAME: ${BITRIX_EXCEL_FILENAME:-Учёт оборудования (авто).xlsx}
      EXCEL_DEBOUNCE_MS: ${EXCEL_DEBOUNCE_MS:-60000}
    ports:
      - "3010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
